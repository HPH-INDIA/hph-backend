services:
  - type: web
    name: hph-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-web.sh
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: KAIRON_IDENTITY_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_SECRET_KEY
        sync: false
      - key: SUPABASE_IMPORT_BUCKET
        value: hph-imports
      - key: IMPORT_MAX_FILE_BYTES
        value: "50000000"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TEMP_PASSWORD_EXPIRY_HOURS
        value: "72"
      - key: CELERY_BROKER_URL
        value: redis://localhost:6379/0
      - key: CELERY_RESULT_BACKEND
        value: redis://localhost:6379/0
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: EMAIL_HOST
        value: localhost
      - key: EMAIL_PORT
        value: "1025"
      - key: EMAIL_USE_TLS
        value: "false"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        value: ""
      - key: DEFAULT_FROM_EMAIL
        value: noreply@vitalysehealth.local
      - key: EMAIL_SUPPRESS_SEND
        value: "true"
      - key: EMAIL_VALIDATE_CONFIG
        value: "false"
      - key: FRONTEND_LOGIN_URL
        value: https://hph.onrender.com/login
      - key: LOG_DECRYPTED_PAYLOADS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://hph.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "120"

  # Render background workers require a paid plan. Provision only during rollout.
  - type: worker
    name: hph-import-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m flask --app run:app process-file-imports
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: KAIRON_IDENTITY_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_SECRET_KEY
        sync: false
      - key: SUPABASE_IMPORT_BUCKET
        value: hph-imports
      - key: IMPORT_MAX_FILE_BYTES
        value: "50000000"
      - key: EMAIL_SUPPRESS_SEND
        value: "true"
      - key: EMAIL_VALIDATE_CONFIG
        value: "false"
