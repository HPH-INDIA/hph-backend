name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    uses: HPH-INDIA/hph/.github/workflows/production.yml@main
    with:
      frontend_ref: main
      backend_ref: ${{ github.sha }}
    secrets:
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
